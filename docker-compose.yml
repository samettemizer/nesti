services:
  nesti-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: nesti-orchestrator:latest
    container_name: nesti-orchestrator
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Mount Docker socket so the orchestrator can spin up the sandbox container
      - /var/run/docker.sock:/var/run/docker.sock
      # Orchestrator creates /tmp/ai-dev-<id>-<rand>/repo inside this volume;
      # the path must be identical on host and container because the sandbox
      # is mounted by the HOST Docker daemon (via the socket above).
      - /tmp:/tmp
      # Optional: persist logs on the host
      - ./logs:/orchestrator/logs
      # Project root: identical host/container path because Boost sandboxes are bind-mounted by the host daemon.
      - "${NESTI_PROJECT_PATH:?Set NESTI_PROJECT_PATH in .env}:${NESTI_PROJECT_PATH:?Set NESTI_PROJECT_PATH in .env}"
      - ./state:/orchestrator/state
    ports:
      # nesti /provider login antigravity runs a short-lived local HTTP
      # listener (scripts/oauth.py AntigravityProvider) to capture Google's
      # OAuth redirect, because Antigravity's hosted callback page consumes
      # the code server-side and never displays it for a manual paste.
      # Bound to localhost only, matching nesti-redis's port below — never
      # exposed to the network.
      - "127.0.0.1:51121:51121"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-60}
    command: ["--loop"]
    depends_on:
      nesti-redis:
        condition: service_healthy
      # main.py waits briefly for Qdrant readiness, then indexes before polling.
      nesti-qdrant:
        condition: service_started

  nesti-stats:
    # Live usage statistics page (nesti /stats): rendered from Redis on every
    # request, so a browser refresh shows current data. Same image as the
    # orchestrator; the entrypoint replaces main.py.
    build:
      context: .
      dockerfile: Dockerfile
    image: nesti-orchestrator:latest
    container_name: nesti-stats
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["python", "-m", "stats.server"]
    ports:
      # Localhost only, same rule as nesti-redis.
      - "127.0.0.1:8790:8790"
    depends_on:
      nesti-redis:
        condition: service_healthy

  nesti-redis:
    # Redis 8 Open Source ships the query engine (FT.CREATE, FLAT/HNSW vector
    # indexing) in the core image — semantic_cache.py needs it for the
    # solution cache and episodic memory. Redis 7 has no such command, and
    # semantic memory then silently disables itself. A Redis 7 AOF loads in
    # Redis 8, so nesti_redis_data survives the upgrade.
    image: redis:8-alpine
    container_name: nesti-redis
    restart: unless-stopped
    # AOF persistence: fsync every second → safe across stop/start, ~1s worst-case loss.
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - nesti_redis_data:/data
    ports:
      # Bind to localhost only – Redis is not exposed outside this host.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nesti-mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    image: nesti-mcp:latest
    container_name: nesti-mcp
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same host-path contract as the orchestrator: gitlab_clone and
      # docker_run_tests operate on /tmp workspaces that the host Docker
      # daemon must be able to see when mounting the sandbox container.
      - /tmp:/tmp
      - ./state:/app/state:ro
    stdin_open: true
    tty: true
    depends_on:
      nesti-redis:
        condition: service_healthy
      nesti-qdrant:
        condition: service_started

  nesti-qdrant:
    # long-term memory: the skills/ corpus, chunked and embedded by
    # scripts/index_skills.py. The tag is coupled to the qdrant-client pin in
    # requirements.txt — bump both together.
    image: qdrant/qdrant:v1.19.1
    container_name: nesti-qdrant
    restart: unless-stopped
    volumes:
      - nesti_qdrant_data:/qdrant/storage
    ports:
      # Localhost only, same rule as nesti-redis.
      - "127.0.0.1:6333:6333"

  nesti-serena:
    # Serena MCP server: semantic code retrieval over NESTI_PROJECT_PATH. The
    # orchestrator's planner queries it read-only (serena_client.py) at
    # http://nesti-serena:9121/mcp; the port is not published. The project is
    # mounted read-only, and Serena's project data (.serena: project.yml,
    # memories, symbol cache) lives in nesti_serena_data instead of the checkout.
    # NESTI_SERENA_ENABLE=false leaves the container idle.
    # shortcut: language-server downloads live in the container layer and repeat
    # after a recreate; mount a volume on SERENA_HOME if that startup cost matters.
    image: ghcr.io/oraios/serena:2.1.0
    container_name: nesti-serena
    restart: unless-stopped
    environment:
      - NESTI_PROJECT_PATH=${NESTI_PROJECT_PATH:?Set NESTI_PROJECT_PATH in .env}
      - NESTI_SERENA_ENABLE=${NESTI_SERENA_ENABLE:-true}
    volumes:
      - "${NESTI_PROJECT_PATH:?Set NESTI_PROJECT_PATH in .env}:${NESTI_PROJECT_PATH:?Set NESTI_PROJECT_PATH in .env}:ro"
      - nesti_serena_data:/workspaces/serena/projects
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        case "$${NESTI_SERENA_ENABLE,,}" in 0|false|no|off) exec sleep infinity;; esac
        set -e
        sed -i 's|^project_serena_folder_location:.*|project_serena_folder_location: "/workspaces/serena/projects/$$projectFolderName/.serena"|' "$$SERENA_HOME/serena_config.yml"
        data="/workspaces/serena/projects/$$(basename "$$NESTI_PROJECT_PATH")/.serena"
        mkdir -p "$$data"
        [ -f "$$data/project.yml" ] || serena project create "$$NESTI_PROJECT_PATH" --language php --language vue
        exec serena start-mcp-server --project "$$NESTI_PROJECT_PATH" --transport streamable-http --host 0.0.0.0 --port 9121 --context ide --mode planning --mode no-onboarding --agent-interface tools --enable-web-dashboard false

  # Build with `up --build`, but leave sandbox containers to the test runners.
  nesti-sandbox-php:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: ${DOCKER_SANDBOX_PHP_IMAGE:-nesti-sandbox-php}
    scale: 0

  nesti-sandbox-node:
    build:
      context: .
      dockerfile: Dockerfile.sandbox.node
    image: ${DOCKER_SANDBOX_NODE_IMAGE:-nesti-sandbox-node}
    scale: 0

  nesti-sandbox-e2e:
    build:
      context: .
      dockerfile: Dockerfile.sandbox.e2e
    image: ${DOCKER_SANDBOX_E2E_IMAGE:-nesti-sandbox-e2e}
    scale: 0

volumes:
  # Survives `docker-compose stop` and `docker-compose down`.
  # Removed only by `docker-compose down -v`.
  nesti_redis_data:
    driver: local
  # Same lifecycle: survives `down`, removed only by `docker-compose down -v`.
  nesti_qdrant_data:
    driver: local
  # Serena project data (symbol cache, memories); same lifecycle as above.
  nesti_serena_data:
    driver: local
